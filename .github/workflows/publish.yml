name: publish

# Publish `invisible-playwright-mcp` from a tag via PyPI Trusted Publishing (OIDC), with no
# long-lived token anywhere. The trust lives in the `pypi` GitHub Environment,
# minted per run and valid for minutes. Only the `upload` job names that
# environment, and it declares `needs: gate`, so a red gate means the only job
# that can authenticate never starts.
#
# BEFORE THE FIRST RUN, on PyPI: the name is unregistered, so Your projects will
# not list it. Use Account -> Publishing -> Add a pending publisher with:
#   PyPI Project Name: invisible-playwright-mcp
#   Owner:             oss-invisible
#   Repository name:   playwright_mcp
#   Workflow name:     publish.yml
#   Environment name:  pypi
# Until that exists the upload fails with `invalid-publisher`, which is the
# correct failure: nothing has said this workflow may speak for this project.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time per repository, whatever started it and on whatever
# ref. Two runs of one tag (a delayed delivery, or a dispatch plus the push)
# would both pass the already-published check before either had uploaded, and
# both would upload. Keyed on the ref, a dispatch on a branch and a push of the
# tag would not wait for each other, so the group is the workflow alone.
# Serialised, the second run waits for the first and then finds the version on
# the index, so it ends as a no-op. Never cancelled in progress: an upload that
# has started must be allowed to finish.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  already-published:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.probe.outputs.present }}
      version: ${{ steps.probe.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        shell: bash
        # Asks the INDEX, not the ledger and not the tag: a re-pushed tag or a
        # backfill is then a logged no-op rather than a red run, and the only
        # answer that stops everything is one that is neither yes nor no.
        run: |
          VERSION="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/invisible-playwright-mcp/$VERSION/json")
          case "$CODE" in
            200) echo "present=yes" >> "$GITHUB_OUTPUT"
                 echo "::notice::invisible-playwright-mcp $VERSION is already on the index. No-op, not a failure." ;;
            404) echo "present=no"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "the index answered $CODE for $VERSION, which is neither present nor absent. Refusing rather than guessing." >&2
                 exit 1 ;;
          esac

  gate:
    needs: already-published
    if: needs.already-published.outputs.present != 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag names the version being built
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HAVE="${{ needs.already-published.outputs.version }}"
          if [ "$TAG" != "$HAVE" ]; then
            echo "tag v$TAG does not name the version in pyproject.toml ($HAVE)" >&2
            exit 1
          fi
      - name: the engine floor is SATISFIABLE on the index
        # The ordering rule as a gate: a floor on a dependency that the index
        # cannot serve installs broken for everyone, while a checkout, being an
        # editable install, never sees it. The MCP server used to be that
        # dependency; since 0.10.0 it ships in this package and the floor that
        # matters is the engine's.
        shell: bash
        run: |
          set -euo pipefail
          FLOOR=$(python - <<'PY'
          import re, tomllib
          with open("pyproject.toml", "rb") as fh:
              deps = tomllib.load(fh)["project"]["dependencies"]
          want = [d for d in deps if re.match(r"invisible[-_]playwright\s*>=", d)]
          if len(want) != 1:
              raise SystemExit("expected exactly one engine dependency with a floor, found %r" % want)
          print(re.search(r">=\s*([0-9]+(?:\.[0-9]+)*)", want[0]).group(1))
          PY
          )
          echo "floor: $FLOOR"
          BEST=$(curl -sf "https://pypi.org/pypi/invisible-playwright/json" \
                 | python -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')
          echo "index serves: $BEST"
          python - "$FLOOR" "$BEST" <<'PY'
          import re, sys
          def key(v):
              return tuple(int(p) for p in re.findall(r"[0-9]+", v))
          floor, best = sys.argv[1], sys.argv[2]
          if key(best) < key(floor):
              sys.exit("the index serves invisible-playwright %s and this release needs >=%s" % (best, floor))
          print("resolvable: %s satisfies >=%s" % (best, floor))
          PY
      - name: install and run the suite
        # A tag push does not trigger the ordinary test workflow, which runs on
        # branches and pull requests, so without this a tag could publish code
        # that no job has ever run.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python -m pytest -q
          # The server's browser tests are deselected by default (marker e2e);
          # a release must drive the tools against a real engine, as the
          # server's own gate did before it moved in here. The engine is
          # fetched into the runner's cache and named to the tests that spawn
          # the server as a subprocess, which otherwise skip.
          export STEALTHFOX_BINARY="$(invisible-playwright fetch | tail -n 1)"
          python -m pytest -q -m e2e tests/mcp_server
      - name: the wheel installs into an empty environment and answers
        # The published artifact is a wheel, and the suite above imports from
        # src/ either way. Only a clean install can tell you that the thing
        # about to reach users actually starts.
        run: |
          pip install build
          python -m build --wheel
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/invisible-playwright-mcp --help
          /tmp/clean/bin/python -m invisible_playwright_mcp --help > /dev/null
          /tmp/clean/bin/python -c "import invisible_playwright_mcp.mcp.server"
          unzip -l dist/*.whl | grep -q "invisible_playwright_mcp/mcp/server.py"

  upload:
    needs: [already-published, gate]
    if: needs.already-published.outputs.present != 'yes'
    runs-on: ubuntu-latest
    environment: pypi          # the OIDC trust relationship lives HERE, behind the gate
    permissions:
      id-token: write          # trusted publishing; no token in a secret anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: twine check
        run: |
          pip install twine
          twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ⛔ THE PAGE WAS THE STEP NOBODY AUTOMATED, AND THE GATE FOR IT REPORTS ONE
  # RELEASE LATE. This workflow published to the index and stopped there, so the
  # release page was left to whoever pushed the tag - and 0.22.0 shipped without
  # one. Nothing said so at the time: the miss surfaced on the NEXT change,
  # where `test_every_published_version_has_a_release_page` walks the index and
  # found a version with no page, on a pull request that had nothing to do with
  # it. A step that cannot be forgotten is worth more than a check that catches
  # the forgetting afterwards.
  #
  # Its own job, and not a step inside `upload`: that one holds the OIDC trust
  # and carries `id-token: write`, and the job that writes to this repository
  # should not be the job that can speak to PyPI.
  release_page:
    needs: [already-published, upload]
    if: needs.already-published.outputs.present != 'yes' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: the version that just shipped gets its page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A page written by hand is better than anything a runner can compose,
          # so an existing one is never touched: this only fills the hole.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::$TAG already has a release page. Left alone."
            exit 0
          fi
          # The body of the tagged commit, which is prose somebody already wrote
          # about this change; its subject line is dropped because the title
          # says the version. An empty body falls back to the subject rather
          # than publishing a page with nothing in it - the release-page test
          # counts an empty one as missing, and it is right to.
          # ⛔ NOT `[ ! -s notes.md ]`. `%b` on a commit with no body writes one
          # byte, a newline, so the file is not empty by size and the fallback
          # never fires: the page would be created carrying a blank line, which
          # the release-page test counts as missing - the exact hole this step
          # exists to close. Measured by running this block.
          git log -1 --format=%b > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            git log -1 --format=%s > notes.md
          fi
          gh release create "$TAG" --title "${TAG#v}" --notes-file notes.md
          echo "::notice::created the release page for $TAG"

  # The Official MCP Registry lists this server from `server.json`, and the
  # entry names a version, so a release that does not also publish here leaves
  # the registry describing the previous one. 0.43.0 was published by hand on
  # 2026-09-12; from the next tag this job does it.
  #
  # It runs when `upload` succeeded AND when the index already had the version,
  # so a `workflow_dispatch` exercises the whole path (install, OIDC login,
  # probe, verify) against the version on the index without publishing anything
  # twice: the registry refuses a duplicate version, so the probe asks first and
  # an entry that is already there is a logged no-op, the same rule `upload`
  # applies to the index. It does NOT run when `gate` failed: then `upload` is
  # skipped and the index has nothing to verify, and the registry checks the
  # package on the index before accepting the entry.
  #
  # Its own job, and after `upload`: the OIDC token that speaks for this
  # repository at the registry has no business in the job that holds the PyPI
  # trust, and the registry needs the package to be on the index first. The
  # index answers minutes before its mirrors do, and the registry reads the
  # index, so the wait below asks the index for the package's description
  # rather than trusting that `upload` returned.
  registry:
    needs: [already-published, upload]
    if: >-
      always() && needs.already-published.result == 'success' &&
      (needs.upload.result == 'success' || needs.already-published.outputs.present == 'yes')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write          # OIDC for the registry; no token in a secret anywhere
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: server.json names the version being built
        shell: bash
        run: |
          set -euo pipefail
          HAVE="${{ needs.already-published.outputs.version }}"
          SJ="$(jq -r '.version' server.json)"
          PKG="$(jq -r '.packages[0].version' server.json)"
          if [ "$SJ" != "$HAVE" ] || [ "$PKG" != "$HAVE" ]; then
            echo "server.json says $SJ (package entry $PKG) and pyproject.toml says $HAVE" >&2
            exit 1
          fi
          echo "NAME=$(jq -r '.name' server.json)" >> "$GITHUB_ENV"
          echo "VERSION=$HAVE" >> "$GITHUB_ENV"
      - name: the index serves this version with the ownership token
        shell: bash
        # The registry validates the package by reading the description PyPI
        # serves. Right after `upload` the index can answer 404 for a while, so
        # this waits for the version AND for the token inside its description,
        # which is the exact thing the registry will look for.
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            BODY="$(curl -s "https://pypi.org/pypi/invisible-playwright-mcp/$VERSION/json" || true)"
            if printf '%s' "$BODY" | jq -e --arg n "$NAME" '.info.description | contains("mcp-name: " + $n)' > /dev/null 2>&1; then
              echo "index serves $VERSION with the token for $NAME"
              exit 0
            fi
            sleep 15
          done
          echo "after 10 minutes the index does not serve $VERSION with 'mcp-name: $NAME' in its description" >&2
          exit 1
      - name: install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help > /dev/null
      - name: authenticate to the registry
        run: ./mcp-publisher login github-oidc
      - name: publish, unless the registry already has this version
        shell: bash
        run: |
          set -euo pipefail
          ENC="$(printf '%s' "$NAME" | jq -sRr @uri)"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/$ENC/versions/$VERSION")"
          case "$CODE" in
            200) echo "::notice::$NAME $VERSION is already on the registry. No-op, not a failure." ;;
            404) ./mcp-publisher validate
                 ./mcp-publisher publish ;;
            *)   echo "the registry answered $CODE for $NAME $VERSION, which is neither present nor absent. Refusing rather than guessing." >&2
                 exit 1 ;;
          esac
      - name: the registry serves it
        shell: bash
        run: |
          set -euo pipefail
          ENC="$(printf '%s' "$NAME" | jq -sRr @uri)"
          GOT="$(curl -sf "https://registry.modelcontextprotocol.io/v0.1/servers/$ENC/versions/$VERSION" | jq -r '.server.version')"
          if [ "$GOT" != "$VERSION" ]; then
            echo "the registry serves version '$GOT' for $NAME, expected $VERSION" >&2
            exit 1
          fi
          echo "registry: $NAME $VERSION"

  # The bundle is a release ASSET, so it has a URL: Smithery's "Publish via
  # URL", a one-click install in Claude Desktop, and anybody who wants the
  # archive get the one this workflow packed from the tagged tree, never one
  # packed by hand. Two archives per release, both from scripts/pack_bundle.py,
  # which refuses an archive holding anything beyond the server: the spec's
  # (server.type uv) and the Smithery variant (type python, the one word its
  # CLI reads). After the release page exists; also on a workflow_dispatch
  # against the version already on the index, where release_page is skipped;
  # never on a red gate, because then there is no page; and an asset already
  # on the page is left alone, so a re-run cannot replace what people fetched.
  bundle:
    needs: [already-published, upload, release_page]
    if: >-
      always() && needs.already-published.result == 'success' &&
      (needs.upload.result == 'success' || needs.already-published.outputs.present == 'yes') &&
      (needs.release_page.result == 'success' || needs.release_page.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pack both bundles and the three extension archives from the tagged tree
        run: |
          set -euo pipefail
          python scripts/pack_bundle.py --output dist
          python scripts/pack_bundle.py --smithery --output dist
          # Gemini CLI installs from the Latest release when it carries an
          # asset named for the platform; without one it clones the whole
          # repository. Three identical archives, one per platform name.
          python scripts/pack_extension.py --output dist
          ls -l dist/*.mcpb dist/*.zip
      - name: attach them to the release page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.already-published.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::no release page for $TAG, nothing to attach to"
            exit 0
          fi
          HAVE="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for f in dist/*.mcpb dist/*.zip; do
            if printf '%s\n' "$HAVE" | grep -qx "$(basename "$f")"; then
              echo "::notice::$(basename "$f") is already on $TAG. Left alone."
            else
              gh release upload "$TAG" "$f"
              echo "attached $(basename "$f") to $TAG"
            fi
          done
